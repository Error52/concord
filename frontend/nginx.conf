# Single entry point on http://localhost: SPA + REST/WebSocket API + LiveKit signalling.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;

  client_max_body_size 30m;

  # Behind the optional Caddy HTTPS proxy: take the client IP from X-Forwarded-For, but only
  # when the request comes from a private (Docker) network, so clients cannot spoof it.
  set_real_ip_from 172.16.0.0/12;
  # nginx's host port must stay bound to loopback behind Caddy (HTTP_BIND=127.0.0.1).
  # Do not trust all LAN clients as reverse proxies.
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  server_tokens off;

  # Same-origin for everything (API, gateway, SFU signalling) → no CORS needed in production.
  include /etc/nginx/security-headers.conf;

  # REST API + /api/gateway WebSocket
  location /api/ {
    set $backend_upstream backend:4000;
    proxy_pass http://$backend_upstream;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
  }

  # LiveKit signalling (WebSocket). Media itself flows over UDP/TCP directly to the SFU / TURN.
  location /livekit/ {
    set $livekit_upstream livekit:7880;
    rewrite ^/livekit/(.*)$ /$1 break;
    proxy_pass http://$livekit_upstream;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
