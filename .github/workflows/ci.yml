name: Concord checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash -n scripts/setup.sh scripts/install-server.sh scripts/dev-native.sh scripts/reindex-db.sh scripts/backup.sh
      - run: sh -n deploy/start-turn.sh
      - run: docker compose --env-file .env.example config --quiet
      - run: node --test test/deployment.test.mjs test/backup.test.mjs test/turn-startup.test.mjs
      - run: docker build --progress=plain -t concord-frontend-ci ./frontend
      - run: docker build --progress=plain -t concord-backend-ci ./backend
      - run: node --test test/nginx-proxy.test.mjs
      - name: Check production native image processing
        run: docker run --rm concord-backend-ci node -e "require('pg'); require('ioredis'); require('sharp')({create:{width:1,height:1,channels:3,background:'#000'}}).png().toBuffer().then(b=>{if(!b.length)process.exit(1)})"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.node-linker=hoisted
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:webrtc

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: concord
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: concord_ci_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concord -d concord_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://concord:ci-only-password@127.0.0.1:5432/concord_ci_test
      REDIS_URL: redis://127.0.0.1:6379/1
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
      LIVEKIT_API_KEY: ci-test
      LIVEKIT_API_SECRET: ci-only-livekit-secret-0123456789abcdef
      LIVEKIT_URL: http://127.0.0.1:17880
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/concord-ci-uploads
      APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY: '1'
      GIF_PROVIDER: none
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.node-linker=hoisted
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
